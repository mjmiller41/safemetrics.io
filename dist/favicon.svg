<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="smGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Geometric Hex Shield -->
  <polygon points="16,2 29,8 29,20 16,30 3,20 3,8" fill="#090d16" stroke="url(#smGrad)" stroke-width="2" />
  <!-- Signal Pulse Wave -->
  <path d="M8 17 L12 17 L14 11 L18 22 L20 15 L24 17" stroke="url(#smGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Pulse Origin Node -->
  <circle cx="16" cy="16.5" r="1.5" fill="#22d3ee" />
</svg>
